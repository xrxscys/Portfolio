<section id="hero" class="hero-section min-h-[100dvh] flex flex-col relative overflow-hidden">

  <!-- Card back crosshatch -->
  <div class="card-pattern" aria-hidden="true"></div>

  <!-- Corner decoration top-left -->
  <div class="corner-index top-left" aria-hidden="true">
    <span class="index-rank font-display">X</span>
    <span class="index-suit">
      <svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="currentColor"/></svg>
    </span>
  </div>

  <!-- Corner decoration bottom-right (mirrored) -->
  <div class="corner-index bottom-right" aria-hidden="true">
    <span class="index-rank font-display">X</span>
    <span class="index-suit">
      <svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="currentColor"/></svg>
    </span>
  </div>

  <!-- Main content -->
  <div class="flex-1 flex flex-col justify-center max-w-7xl mx-auto w-full px-6 lg:px-12">

    <div class="hero-grid">

      <!-- Left: Name + title -->
      <div class="hero-left">
        <p class="hero-eyebrow font-mono-custom reveal">
          <span class="dot"></span>Available for work
        </p>

        <h1 class="hero-name font-display reveal">
          <span class="name-first">Xerxes</span>
          <span class="name-last">Cuyos</span>
        </h1>

        <p class="hero-role font-mono-custom reveal">Full Stack Developer</p>

        <p class="hero-location font-sans reveal">Cebu City, Philippines</p>

        <div class="hero-actions reveal">
          <a href="#contact" (click)="scrollTo($event,'contact')" class="btn-primary font-mono-custom">
            Get in touch
          </a>
          <a href="#experience" (click)="scrollTo($event,'experience')" class="btn-ghost font-mono-custom">
            View work
          </a>
        </div>
      </div>

      <!-- Right: Playing card — tilt zone -->
      <div
        class="hero-right reveal"
        (mousemove)="onMouseMove($event)"
        (mouseleave)="onMouseLeave()"
        #cardWrap
      >
        <div class="playing-card" #playingCard>

          <!-- Sheen overlay -->
          <div class="hero-sheen" #heroSheen aria-hidden="true"></div>

          <!-- Corner indices -->
          <div class="pc-corner pc-tl">
            <span class="pc-rank font-display">XC</span>
            <svg class="pc-suit" width="12" height="12" viewBox="0 0 12 12"><polygon points="6,0 12,6 6,12 0,6" fill="currentColor"/></svg>
          </div>
          <div class="pc-corner pc-br">
            <span class="pc-rank font-display">XC</span>
            <svg class="pc-suit" width="12" height="12" viewBox="0 0 12 12"><polygon points="6,0 12,6 6,12 0,6" fill="currentColor"/></svg>
          </div>

          <!-- Center monogram -->
          <div class="pc-center">
            <div class="pc-monogram font-display">XC</div>
            <div class="pc-divider"></div>
            <div class="pc-tagline font-mono-custom">Full Stack Dev</div>
          </div>

          <!-- Suit decorations -->
          <div class="pc-suits-row" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 14 14"><polygon points="7,0 14,7 7,14 0,7" fill="var(--accent)" opacity="0.5"/></svg>
            <svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="var(--accent)" opacity="0.25"/></svg>
            <svg width="14" height="14" viewBox="0 0 14 14"><polygon points="7,0 14,7 7,14 0,7" fill="var(--accent)" opacity="0.5"/></svg>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="scroll-indicator" #scrollIndicator>
    <div class="scroll-line"></div>
    <span class="font-mono-custom text-[10px] tracking-widest" style="color:var(--text-dim)">SCROLL</span>
  </div>

</section>
